name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q app.py server.py src scripts tests

      - name: Run static checks
        run: python -m pyflakes app.py server.py src scripts tests

      # 프런트 JS는 파이썬 도구가 보지 못한다 — 문법 오류가 그대로 배포되던 자리다(R5).
      # 러너에 Node가 이미 있어 의존성을 추가하지 않는다.
      - name: Check front-end JS syntax
        run: |
          for f in web/assets/*.js; do node --check "$f"; done

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      # R3~R5의 검토 조서가 만든 회귀 방지 장치. 셋 다 네트워크·API 키가 필요 없다.
      # 사람이 기억해서 돌리는 검증은 회귀를 막지 못하므로 PR마다 자동으로 돌린다.
      - name: Run review guards (static)
        run: |
          python scripts/check_screen_language.py
          python scripts/check_design.py
          python scripts/check_structure.py
          python scripts/check_adr_index.py

      - name: Run deterministic finance checks
        run: |
          python scripts/check_bond.py
          python scripts/check_portfolio.py

      # 같은 수식이 파이썬과 JS 두 곳에 산다(#84). 손으로 옮겨 적은 참조 구현이 아니라
      # 브라우저가 실제로 받는 web/assets/finmath.js를 Node로 실행해 쌍둥이와 대조한다.
      # 위 문법 검사와 같은 러너 Node를 쓰므로 의존성이 늘지 않는다.
      - name: Check cross-language math parity
        run: python scripts/check_client_math.py
