# 미국 계수가 왜 러너에서만 못 만들어지나 — 야후의 어느 통로가 살아 있는지 잰다.
#
# 왜 워크플로가 따로 있나: 이 질문은 **집 PC에서 못 잰다.** 집에서는 전부 성공하고
# (2026-08-14 실측: info 값 184개 · 5/5종목 다리 4/4) 러너에서만 비기 때문이다.
# 야후가 IP로 가르는 것으로 보이므로, **문제의 자리에서 재야** 뜻이 있다.
#
# 재고 나면 지운다 — 진단용이지 상시 워크플로가 아니다.
#
# 아무것도 쓰지 않는다: 읽기 전용이고 브랜치에 푸시하지 않는다.
name: Probe US sources

on:
  workflow_dispatch:      # 손으로만 돌린다. 예약하지 않는다
  # ⚠ `workflow_dispatch`는 **워크플로가 main에 있어야** 손으로 돌릴 수 있다.
  # 이건 재고 지울 진단이라 main을 거치지 않으려고, 이 브랜치 푸시에만 반응하게 둔다.
  push:
    branches: ["diag/us-source-probe"]

permissions:
  contents: read          # 읽기만 한다

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Probe
        run: python scripts/check_us_sources.py
