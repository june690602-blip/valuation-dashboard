# ①의 회귀 계수를 밤에 구워 별도 브랜치에 둔다 (이슈 #131).
#
# 왜: 계수가 없으면 서버가 전 종목 2,871개를 긁는다(실측 58초, 레이트리밋이 겹치면 더).
# 그 시간을 **방문자가 아니라 CI가 낸다.** 새벽에 아무도 안 기다린다.
#
# main에 커밋하지 않는 이유 둘:
#   1. 봇 커밋이 main 히스토리에 매일 쌓인다
#   2. Render가 main 푸시마다 자동 재배포한다 — 데이터 갱신으로 배포가 돌 이유가 없다
# 그래서 `data-coefficients` 브랜치에 **orphan + force-push**로 둔다. 그 브랜치는
# 커밋이 늘 하나뿐이고, main과 히스토리를 공유하지 않으며, PR도 만들지 않는다.
#
# 시크릿이 필요 없다 — 계수 수집은 네이버·yfinance·FDR만 쓴다(DART 키는 안 쓴다).
name: Coefficients

on:
  schedule:
    # 하루 **두 번** 시도한다 — KRX 차단이 상시가 아니라 가끔이기 때문이다(ADR-0049).
    # 2026-08-12 같은 러너에서 06:17 성공 · 19:43 `Access Denied`였다. 실패가 이제
    # 무해하므로(이전 파일을 이어받는다) 시도를 늘리는 것이 그대로 성공 확률이 된다.
    # 정각을 피한 건 정각에 CI가 몰려 느려지기 때문이다.
    - cron: "40 18 * * *"   # 한국시간 03:40
    - cron: "20 2 * * *"    # 한국시간 11:20 — 아침에 막혔으면 여기서 한 번 더
  workflow_dispatch:      # 손으로도 돌릴 수 있게 — 브랜치를 처음 만들 때 이걸 쓴다

permissions:
  contents: write         # 브랜치에 푸시해야 한다

concurrency:
  group: coefficients
  cancel-in-progress: false   # 반쯤 만들다 잘리면 브랜치에 깨진 파일이 남는다

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30       # 실측 1분 남짓. 레이트리밋으로 늘어질 때를 감안한 상한이다
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # **CI에 기억을 준다**(ADR-0051). `data/cache/`는 `.gitignore`라 러너가 매번 빈 캐시로
      # 시작했고, 그래서 2,687종목을 밤마다 통째로 생짜 요청했다. yfinance가 레이트리밋
      # (`Invalid Crumb` 401)으로 죽인 만큼이 **표본에서 통째로 빠졌다** — ev_ebitda가
      # 1,376 → 565, psr이 1,999 → 728로 얇아진 것이 그것이다.
      #
      # `file_cache`에 이미 답이 있다: **받아오다 실패하면 예전 값을 대신 쓴다**(stale-ok).
      # 어제 캐시만 쥐여주면 오늘 막힌 종목은 어제 값으로 채워지고 표본에서 빠지지 않는다.
      # 즉 새 개념이 아니라 **있는 장치를 켜는 것**이다.
      #
      # restore/save를 갈라 쓰는 이유: 이 잡은 **일부러 실패로 끝날 수 있다**(한 시장을
      # 이어받으면 빨간불 — ADR-0049). 그때도 캐시는 남겨야 다음 밤이 이어받는다.
      - name: Restore source cache (어제 받아 둔 원천)
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: coef-source-cache-
          restore-keys: coef-source-cache-

      # ⚠ **이 단계가 사고를 막는 자리다**(ADR-0049). 아래 publish가 출력 폴더를 orphan
      # force-push 하므로, 폴더에 없는 파일은 **브랜치에서도 지워진다.** 2026-08-12 밤에
      # KR이 KRX 차단으로 실패했을 때 정확히 그 일이 났다 — 초록불로 끝나면서 멀쩡하던
      # 어제치 `KR.json`을 지웠고, 서버는 404를 받아 전 종목 수집(실측 263초)으로 물러났다.
      # 브랜치의 현재 내용을 먼저 깔아 두면 **못 만든 시장은 어제 파일이 그대로 남는다.**
      - name: Seed from the data branch (못 만든 시장은 이어받는다)
        run: |
          set -euo pipefail
          mkdir -p dist/coefficients
          if git ls-remote --exit-code --heads origin data-coefficients >/dev/null 2>&1; then
            git fetch --depth 1 origin data-coefficients
            git archive FETCH_HEAD | tar -x -C dist/coefficients
            echo "이어받은 파일:"; ls -1 dist/coefficients
          else
            echo "data-coefficients 브랜치가 아직 없다 — 처음 만드는 것이다."
          fi

      # 끝내는 코드: 0=전부 새로 만듦 · 2=일부 이어받음(publish는 해야 한다) · 1=낼 것이 없음
      - name: Build coefficients
        id: build
        run: |
          set +e
          python scripts/build_coefficients.py --out dist/coefficients
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 1이면 낼 것이 없다 → 여기서 멈춰 publish가 브랜치를 비우지 못하게 한다.
          [ "$code" -eq 1 ] && exit 1
          exit 0

      # orphan 커밋으로 덮어쓴다 — 브랜치 히스토리가 자라지 않는다(늘 커밋 1개).
      # 위 seed 덕분에 이 force-push는 **이번에 못 만든 시장을 지우지 않는다.**
      # ⚠ **main에서만 낸다.** 이 단계는 `data-coefficients`를 orphan force-push 하는데,
      # 그 브랜치는 **라이브 서비스가 읽는 곳**이다. 브랜치에서 손으로 돌린 시험 실행이
      # 운영 계수를 덮어쓰면 안 된다 — ADR-0049가 데인 것과 같은 종류(빌드가 데이터를
      # 파괴하는 것)이고, 그때는 예약 실행이 범인이었지만 여기서는 시험 실행이 범인이 된다.
      # 시험은 아래 '만든 것 보여주기'로 확인한다.
      - name: Publish to data branch
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          cd dist/coefficients
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan data-coefficients
          git add -A
          git commit -q -m "chore(data): 회귀 계수 갱신 — $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            data-coefficients
          echo "→ https://github.com/${{ github.repository }}/tree/data-coefficients"

      # main이 아닐 때(시험 실행) 무엇이 나왔는지만 보여 준다 — 내보내지는 않는다.
      - name: Show what it made (main이 아니라 내보내지 않았다)
        if: github.ref != 'refs/heads/main'
        run: |
          echo "⚠ main이 아니므로 data-coefficients에 내보내지 않았다. 만든 것은 아래와 같다."
          ls -la dist/coefficients
          cat dist/coefficients/meta.json

      # **초록불이 거짓말하지 않게 한다.** 예전에는 KR을 못 만들어도 초록이었고, 그래서
      # 아무도 몰랐다. 좋은 쪽은 이미 위에서 냈으므로 여기서 실패해도 잃는 것이 없다.
      - name: Fail if any market was carried over
        if: steps.build.outputs.code == '2'
        run: |
          echo "::error::한 시장을 이번에 만들지 못해 이전 파일을 이어받았다. \
          계수가 그만큼 낡았다는 뜻이다 — data-coefficients 브랜치의 meta.json에서 \
          어느 시장이 언제 만들어진 것인지 확인하라(ADR-0049)."
          exit 1

      # `if: always()` — 위 단계가 일부러 실패했을 때도 캐시는 남겨야 한다(ADR-0051).
      # 키에 run_id를 넣어 매번 새로 쓰고, 복원은 접두사로 가장 최근 것을 집는다.
      - name: Save source cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: coef-source-cache-${{ github.run_id }}
